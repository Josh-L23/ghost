[workspace]
members = [
    "crates/ghost-core",
    "crates/ghost-network",
    "crates/ghost-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ghost-core = { path = "crates/ghost-core" }
ghost-network = { path = "crates/ghost-network" }
ratatui = "0.30.2"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }

