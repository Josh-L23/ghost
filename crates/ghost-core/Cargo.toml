[package]
name = "ghost-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport- and UI-independent application concepts for Project GHOST"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
x25519-dalek = "2"
zeroize = "1"
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }

[dev-dependencies]
tempfile = "3"

